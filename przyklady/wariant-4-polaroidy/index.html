<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title id="pageTitleTag">Studio Persona</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,500&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --base:#F2ECE2; --elevated:#EAE1D0; --elevated2:#E0D5C0; --line:#D3C4AC;
    /* Wariant "Polaroidy": stonowany - jasna, przygaszona, kremowa baza zamiast czerni */
    --gold:#B98268; --goldBright:#C99A82; --violet:#8C7A94; --ink:#3F362C; --muted:#8C7F6E;
    --paper:#FFFDF8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html{scroll-behavior:smooth;}
  body{ background:var(--base); color:var(--ink); font-family:'Inter',sans-serif; -webkit-font-smoothing:antialiased; padding-bottom:86px; }
  h1,h2{font-family:'Fraunces',serif; font-weight:500;}
  .wrap{ max-width:820px; margin:0 auto; padding:0 20px; }
  .eyebrow{ font-family:'JetBrains Mono',monospace; letter-spacing:.2em; text-transform:uppercase; font-size:.68rem; color:var(--goldBright); }

  /* HERO - DUZY POLAROID (bezpieczny kwadrat zamiast ucinanego szerokiego banera) */
  .hero-polaroid-wrap{ padding:52px 20px 8px; text-align:center; }
  .big-polaroid{
    display:inline-block; background:var(--paper); padding:14px 14px 0; border-radius:3px;
    box-shadow:0 18px 34px -12px rgba(0,0,0,.35); transform:rotate(-3deg);
    width:min(80vw, 340px); position:relative;
  }
  .big-polaroid .photo-inner{ width:100%; aspect-ratio:1/1; overflow:hidden; background:var(--elevated2); }
  .big-polaroid .photo-inner img{ width:100%; height:100%; object-fit:cover; display:block; }
  .big-polaroid .frame-bottom{ height:34px; }
  .pin{
    position:absolute; top:-9px; left:50%; transform:translateX(-50%); width:15px; height:15px;
    border-radius:50%; background:radial-gradient(circle at 35% 30%, var(--goldBright), var(--gold));
    box-shadow:0 2px 5px rgba(0,0,0,.35); z-index:2;
  }
  .hero-text{ margin-top:22px; }
  .hero-text h1{ font-size:2rem; font-style:italic; color:var(--ink); margin-top:8px; }
  .hero-text .occasion{ color:var(--muted); font-size:.88rem; margin-top:6px; }
  @media(min-width:640px){ .hero-text h1{ font-size:2.5rem; } }

  /* KOLAŻ */
  .wrap{ position:relative; }
  .wrap::before{
    content:""; position:absolute; top:-60px; left:0; right:0; height:340px; z-index:-1; pointer-events:none;
    background: radial-gradient(circle at 50% 0%, rgba(185,130,104,.16), transparent 60%);
  }
  .collage-head{ text-align:center; margin:56px 0 30px; position:relative; }
  .collage-head h2{ font-size:1.4rem; }
  .collage{
    display:grid; grid-template-columns:repeat(2,1fr); gap:26px 18px; padding-bottom:20px;
  }
  @media(min-width:640px){ .collage{ grid-template-columns:repeat(3,1fr); gap:34px 24px; } }

  .polaroid{
    background:var(--paper); padding:10px 10px 34px; border-radius:2px; cursor:pointer;
    box-shadow:0 16px 30px -14px rgba(0,0,0,.6); transition:transform .2s;
  }
  .polaroid:hover{ transform:translateY(-4px) rotate(0deg) !important; }
  .polaroid img{ width:100%; aspect-ratio:1/1; object-fit:cover; display:block; }
  .polaroid figcaption{ font-family:'Fraunces',serif; font-style:italic; font-size:.78rem; color:#3a3542; text-align:center; margin-top:10px; }
  .polaroid:nth-child(6n+1){ transform:rotate(-3deg); }
  .polaroid:nth-child(6n+2){ transform:rotate(2deg); }
  .polaroid:nth-child(6n+3){ transform:rotate(-1.5deg); }
  .polaroid:nth-child(6n+4){ transform:rotate(3deg); }
  .polaroid:nth-child(6n+5){ transform:rotate(-2.5deg); }
  .polaroid:nth-child(6n+6){ transform:rotate(1.5deg); }

  /* DEDYKACJA JAKO KARTKA W KOLAŻU */
  .note-card{
    background:var(--elevated); border:1px solid var(--line); border-radius:2px; padding:20px 16px;
    display:flex; align-items:center; justify-content:center; text-align:center;
    font-family:'Fraunces',serif; font-style:italic; font-size:.92rem; line-height:1.55; color:var(--ink);
    box-shadow:0 16px 30px -14px rgba(0,0,0,.6); transform:rotate(-2deg);
  }
  .note-card .signature{ display:block; margin-top:10px; font-style:normal; font-family:'JetBrains Mono',monospace; font-size:.62rem; letter-spacing:.08em; color:var(--gold); text-transform:uppercase; }

  /* PŁYWAJĄCY PASEK ODTWARZACZA */
  .float-player{
    position:fixed; left:16px; right:16px; bottom:16px; max-width:520px; margin:0 auto;
    background:rgba(19,19,25,.9); backdrop-filter:blur(10px); border:1px solid var(--line); border-radius:999px;
    padding:10px 16px; display:flex; align-items:center; gap:12px; z-index:50; box-shadow:0 20px 40px -16px rgba(0,0,0,.7);
  }
  .play-btn{ width:38px; height:38px; border-radius:50%; border:none; cursor:pointer; flex-shrink:0; background:linear-gradient(90deg,var(--gold),var(--goldBright)); display:flex; align-items:center; justify-content:center; color:var(--base); }
  .float-mid{ flex:1; min-width:0; }
  .song-title{ font-size:.72rem; font-family:'JetBrains Mono',monospace; color:#C9BFB0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  input[type=range]{ width:100%; accent-color:var(--gold); height:3px; cursor:pointer; margin-top:4px; }
  .download-link{ flex-shrink:0; font-size:.68rem; color:var(--gold); white-space:nowrap; }

  .lightbox{ position:fixed; inset:0; background:rgba(10,10,15,.94); display:none; align-items:center; justify-content:center; z-index:100; padding:20px; }
  .lightbox.open{ display:flex; }
  .lightbox img{ max-width:100%; max-height:85vh; border-radius:12px; }
  .lightbox-close{ position:absolute; top:20px; right:20px; background:none; border:none; color:#F5F3EE; font-size:1.8rem; cursor:pointer; }

  footer{ text-align:center; padding:30px 20px 20px; font-size:.7rem; color:var(--muted); }
  footer a{ color:var(--gold); }
</style>
</head>
<body>

<div class="hero-polaroid-wrap">
  <div class="big-polaroid">
    <div class="pin"></div>
    <div class="photo-inner"><img id="heroImg" src="" alt=""></div>
    <div class="frame-bottom"></div>
  </div>
  <div class="hero-text">
    <p class="eyebrow">Studio Persona • dedykowana piosenka</p>
    <h1 id="recipientName"></h1>
    <p class="occasion" id="occasion"></p>
  </div>
</div>

<div class="wrap">
  <div class="collage-head" id="galleryHead">
    <p class="eyebrow">Kolaż</p>
    <h2>Wasze wspomnienia</h2>
  </div>
  <div class="collage" id="gallery"></div>

  <footer>
    Stworzone z miłością przez <a id="footerLink" target="_blank" rel="noopener"></a>
  </footer>
</div>

<div class="float-player">
  <audio id="audio" preload="metadata"></audio>
  <button class="play-btn" id="playBtn" aria-label="Odtwórz">
    <svg id="iconPlay" width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><path d="M3 2l11 6-11 6V2z"/></svg>
    <svg id="iconPause" width="12" height="12" viewBox="0 0 16 16" fill="currentColor" style="display:none;"><rect x="3" y="2" width="4" height="12"/><rect x="9" y="2" width="4" height="12"/></svg>
  </button>
  <div class="float-mid">
    <span class="song-title" id="songTitle"></span>
    <input type="range" id="seek" min="0" max="100" value="0">
  </div>
  <a class="download-link" id="downloadLink" download>MP3 ↓</a>
</div>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()" aria-label="Zamknij">&times;</button>
  <img id="lightboxImg" src="" alt="">
</div>

<script src="config.js"></script>
<script>
  document.getElementById('pageTitleTag').textContent = CONFIG.pageTitle;
  document.getElementById('recipientName').innerHTML = 'Dla ' + CONFIG.recipientName;
  document.getElementById('occasion').textContent = CONFIG.occasion;
  document.getElementById('songTitle').textContent = '„' + CONFIG.songTitle + '"';

  const audioEl = document.getElementById('audio');
  audioEl.src = CONFIG.songFile;
  document.getElementById('downloadLink').href = CONFIG.songFile;

  const heroImgEl = document.getElementById('heroImg');
  if (CONFIG.photos && CONFIG.photos.length > 0) {
    heroImgEl.src = CONFIG.photos[0].src;
  }

  const galleryEl = document.getElementById('gallery');
  const galleryHeadEl = document.getElementById('galleryHead');
  const hasPhotos = CONFIG.photos && CONFIG.photos.length > 0;
  const hasDedication = CONFIG.dedication && CONFIG.dedication.trim() !== '';

  if (hasPhotos) {
    // Pomijamy pierwsze zdjęcie w kolażu (jest już w hero)
    CONFIG.photos.slice(1).forEach((photo) => {
      const fig = document.createElement('figure');
      fig.className = 'polaroid';
      fig.addEventListener('click', () => openLightbox(photo.src));
      fig.innerHTML = `<img src="${photo.src}" alt="${photo.caption||''}" loading="lazy"><figcaption>${photo.caption||''}</figcaption>`;
      galleryEl.appendChild(fig);
    });
  }

  // Dedykacja jako kartka wmieszana w kolaż
  if (hasDedication) {
    const note = document.createElement('div');
    note.className = 'note-card';
    note.innerHTML = `<div><span>„${CONFIG.dedication}"</span><span class="signature">${CONFIG.signature||''}</span></div>`;
    galleryEl.insertBefore(note, galleryEl.children[Math.min(1, galleryEl.children.length)]);
  }

  if (!hasPhotos && !hasDedication) {
    galleryEl.style.display = 'none';
    galleryHeadEl.style.display = 'none';
  }

  const footerLinkEl = document.getElementById('footerLink');
  footerLinkEl.href = CONFIG.footerLinkUrl;
  footerLinkEl.textContent = CONFIG.footerLinkLabel;

  const audio = document.getElementById('audio');
  const playBtn = document.getElementById('playBtn');
  const iconPlay = document.getElementById('iconPlay');
  const iconPause = document.getElementById('iconPause');
  const seek = document.getElementById('seek');
  function fmt(s){ if(!isFinite(s)) return "0:00"; const m=Math.floor(s/60), sec=Math.floor(s%60); return m+":"+String(sec).padStart(2,'0'); }
  audio.addEventListener('timeupdate', () => {
    seek.value = audio.duration ? (audio.currentTime/audio.duration)*100 : 0;
  });
  audio.addEventListener('ended', () => { playBtn.click(); });
  playBtn.addEventListener('click', () => {
    if(audio.paused){ audio.play(); iconPlay.style.display='none'; iconPause.style.display='block'; }
    else { audio.pause(); iconPlay.style.display='block'; iconPause.style.display='none'; }
  });
  seek.addEventListener('input', (e) => { if(audio.duration) audio.currentTime = (e.target.value/100)*audio.duration; });

  function openLightbox(src){
    document.getElementById('lightboxImg').src = src;
    document.getElementById('lightbox').classList.add('open');
  }
  function closeLightbox(){
    document.getElementById('lightbox').classList.remove('open');
  }
</script>

</body>
</html>
